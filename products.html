<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل المنتج — SPILL</title>
  <link rel="icon" type="image/png" href="image-coffee/logo-spill.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="store-ui.css" />
  <style>
    :root {
      --pd-bg: #f3efe9;
      --pd-surface: #faf8f5;
      --pd-ink: #2b241f;
      --pd-muted: #6f655d;
      --pd-line: #dfd6ca;
      --pd-accent: #8b5a2b;
    }

    html[data-theme="dark"] {
      --pd-bg: #181512;
      --pd-surface: #211d19;
      --pd-ink: #efe9e2;
      --pd-muted: #a69c92;
      --pd-line: #342d27;
      --pd-accent: #c48b52;
    }

    body.pd-page {
      background-color: var(--pd-bg);
      background-image: none;
      color: var(--pd-ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    body.pd-page::before {
      display: none;
    }

    .pd-page .site-header,
    .pd-page .site-footer {
      background-color: var(--pd-surface);
      border-color: var(--pd-line);
    }

    .pd-main {
      max-width: 920px;
      width: 100%;
      margin: 1.75rem auto 3rem;
      padding: 0 1.1rem;
      flex: 1;
      box-sizing: border-box;
    }

    .pd-box {
      background-color: var(--pd-surface);
      border: 1px solid var(--pd-line);
      border-radius: 20px;
      padding: 1.4rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      box-sizing: border-box;
    }

    .pd-loading {
      color: var(--pd-muted);
      font-size: 0.95rem;
      text-align: center;
      padding: 2rem 0.5rem;
    }

    .pd-detail-layout {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 1.5rem;
      align-items: start;
    }

    .pd-img-box {
      background-color: var(--pd-bg);
      border: 1px solid var(--pd-line);
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pd-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .pd-info {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .pd-actions {
      display: flex;
      gap: 0.65rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .pd-actions .add-cart-btn,
    .pd-actions .checkout-btn {
      flex: 1;
      min-width: 140px;
    }

    @media (max-width: 768px) {
      .pd-main {
        margin: 1rem auto 2.2rem;
        padding: 0 0.75rem;
      }

      .pd-box {
        padding: 1rem;
        border-radius: 16px;
      }

      .pd-detail-layout {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .pd-img-box {
        max-height: 280px;
      }
    }
  </style>
</head>
<body class="pd-page">
  <header class="site-header">
    <div class="header-right">
      <a id="back-to-store-link" href="index.html" class="checkout-link" style="text-decoration: none;">
        <i class="fa-solid fa-arrow-right"></i>
        <span>عودة</span>
      </a>
      <span class="brand-name">SPILL</span>
    </div>

    <div class="header-center">
      <a href="index.html" class="center-logo-link" aria-label="SPILL">
        <img src="image-coffee/logo-spill.png" alt="w7ty logo" class="center-logo-img" />
      </a>
    </div>

    <div class="header-left">
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="تبديل الوضع الليلي">
        <i class="fa-solid fa-moon"></i>
      </button>
      <button id="cart-toggle" class="checkout-link" type="button">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>السلة (<span id="cart-count">0</span>)</span>
      </button>
    </div>
  </header>

  <div id="cart-overlay" class="cart-overlay" hidden></div>
  <aside id="cart-drawer" class="cart-drawer" aria-hidden="true">
    <div class="drawer-header">
      <h3>السلة</h3>
      <button id="cart-close" class="icon-btn" type="button" aria-label="إغلاق السلة">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div id="cart-items" class="cart-items"></div>

    <div class="cart-summary">
      <span>الإجمالي:</span>
      <strong id="cart-total">0.00 ر.س</strong>
    </div>
    <a href="checkout.html" class="checkout-btn">إتمام الطلب</a>
  </aside>

  <main class="pd-main">
    <section id="product-detail-box" class="pd-box">
      <p class="pd-loading">جاري تحميل تفاصيل المنتج...</p>
    </section>
  </main>

  <footer class="site-footer">
    <p class="copyright">جميع الحقوق محفوظة &copy; 2026 w7ty</p>
  </footer>

  <script src="products.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
